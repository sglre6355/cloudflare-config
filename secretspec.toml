[project]
name = "cloudflare-config"
revision = "1.0"

[profiles.default]
CLOUDFLARE_API_TOKEN = { description = "Access token from the active cf CLI login", type = "command", generate = { command = 'p=$(env -u CLOUDFLARE_API_TOKEN cf auth whoami --json | jq -er ".authSource | capture(\"^OAuth token from (?<p>.+)$\").p") && jq -j .oauth_token "$p"' }, providers = ["null"] }
TF_VAR_state_passphrase = { description = "Encryption passphrase for the OpenTofu state and plan files", type = "password", generate = true, providers = ["sops://secrets.yaml"] }
TF_VAR_ilink_web_discord_application_secret = { description = "OAuth2 client secret of ilink-web's Discord application", providers = ["sops://secrets.yaml"] }
# TODO: Generate this with the `jwk_private_key` type once nixpkgs has
# SecretSpec 0.22, and drop nodejs from the development shell in `flake.nix`.
TF_VAR_ilink_web_discord_oidc_signing_key = { description = "Private JWK ilink-web's Discord OIDC Worker signs ID tokens with", type = "command", generate = { command = '''node -e 'const c = require("crypto"); const k = c.generateKeyPairSync("rsa", { modulusLength: 2048 }).privateKey.export({ format: "jwk" }); process.stdout.write(JSON.stringify({ ...k, alg: "RS256", use: "sig", kid: c.randomUUID() }))' ''' }, providers = ["sops://secrets.yaml"] }
